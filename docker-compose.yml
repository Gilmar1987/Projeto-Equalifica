version: "3.9"
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: equalifica
      POSTGRES_USER: equalifica
      POSTGRES_PASSWORD: equalifica123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      SECRET_KEY: "django-insecure-equalifica-dev"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      DATABASE_URL: "postgres://equalifica:equalifica123@db:5432/equalifica"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  celery:
    build: .
    environment:
      DEBUG: "1"
      SECRET_KEY: "django-insecure-equalifica-dev"
      DATABASE_URL: "postgres://equalifica:equalifica123@db:5432/equalifica"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    command: celery -A equalifica_project worker --loglevel=info

volumes:
  postgres_data:
  redis_data: